<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_blank">
<title>Leopardo Efficiency — Weekly Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1a3967;--yellow:#fee600;--cream:#ede9e3;--gray:#908b86;--ink:#1c2330;--muted:#5d6675;--line:#dcdfe5;--paper:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Libre Franklin",system-ui,sans-serif;color:var(--ink);background:#e7e9ed;line-height:1.55;padding:28px 14px 44px}
  .sheet{max-width:760px;margin:0 auto;background:var(--paper);border-radius:6px;box-shadow:0 1px 4px rgba(26,57,103,.12);overflow:hidden}
  .masthead{background:var(--navy);color:#fff;padding:26px 40px}
  .masthead .ey{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow)}
  .masthead h1{font-size:25px;font-weight:800;margin-top:4px}
  .masthead p{font-size:13px;color:#c4d0e2;margin-top:6px}
  .pad{padding:30px 40px 36px}
  .rcard{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
  .rcard:hover{border-color:var(--navy);background:#fbfbfc}
  .rcard.latest{border-color:var(--navy);border-width:1.5px}
  .num{flex:none;width:46px;height:46px;border-radius:10px;background:var(--cream);color:var(--navy);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
  .rcard.latest .num{background:var(--yellow)}
  .rc-body{flex:1;min-width:0}
  .rc-date{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .rc-title{font-size:16px;font-weight:700;color:var(--ink);margin-top:1px}
  .rc-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .arrow{flex:none;color:var(--navy);font-weight:700;font-size:18px}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--yellow);color:#0b0b0b;border-radius:20px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .note{font-size:13px;color:var(--gray);margin-top:8px}
  .foot{border-top:1px solid var(--line);padding:16px 40px;font-size:12px;color:var(--gray);font-weight:600}
  @media(max-width:600px){.pad,.masthead,.foot{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
  <div class="sheet">
    <div class="masthead">
      <div class="ey">Leopardo Efficiency</div>
      <h1>Weekly Reports</h1>
      <p>The latest report is always at the top. Bookmark this page.</p>
    </div>
    <div class="pad">

      <a class="rcard latest" href="2026-06-22-weekly.html">
        <div class="num">01</div>
        <div class="rc-body">
          <div class="rc-date">Week of June 22, 2026</div>
          <div class="rc-title">Weekly Report <span class="tag">Latest</span></div>
          <div class="rc-sub">Opportunity intake live · YouTube channel launched · top 3 LinkedIn contacts</div>
        </div>
        <div class="arrow">→</div>
      </a>

      <p class="note">New reports are added here each week.</p>
    </div>
    <div class="foot">The VDO Aigency · June 2026</div>
  </div>
</body>
</html>
